function build(i,m){

function home(){
  phase="home";$("hud").hidden=true;const dn=Object.keys(R).length,ro=dn?"readonly":"";if(!W)build(0,"card");reset(4);
  ov(`<h1>Questara: Petualangan Proposal</h1><p class="mut">Tiap tahap ada dua petualangan. <b>1) Jalur Hafalan:</b> ketuk layar untuk melompat maju, dekati kristal biru, baca kartu 20 detik. <b>2) Jalur Ujian:</b> kartu ditutup, jawab soal isian di tiap gerbang. Kumpulkan cincin emas untuk menambah HP.</p>
  <label>Nama<input id="nm" value="${esc(name)}" autocomplete="off" ${ro}></label><label>Kelas<input id="kl" value="${esc(kelas)}" placeholder="Contoh: XI TPM 1" autocomplete="off" ${ro}></label><p class="err" id="er"></p>
  ${S.map((s,i)=>R[i]!=null?`<button class="st" disabled><span>Tahap ${i+1}: ${s.t}<small>${s.w}</small></span><span>${R[i]}/10</span></button>`:`<button class="st" data-i="${i}"><span>Tahap ${i+1}: ${s.t}<small>${s.w} · 10 kartu, 10 gerbang</small></span><span>Mulai</span></button>`).join("")}
  ${dn===3?'<button id="sm">Lihat penilaian akhir</button>':""}`);
}
function begin(i){st=i;hp=100;solved=0;cp=4;A[st]=[];build(st,"card");reset(4);hud();phase="intro";$("hud").hidden=true;
  ov(`<h2>Tahap ${i+1}: ${S[i].w}</h2><p><b>Jalur Hafalan.</b> Ketuk layar untuk melompat maju, tahan untuk berjalan pelan (keyboard: Spasi atau WASD). Dekati kristal biru untuk membaca kartu selama 20 detik. Lompati jurang dan ambil cincin emas untuk menambah HP.</p><button id="sp">Mulai berjalan</button>`)}
function go(){ov(null);phase="play";$("hud").hidden=false;hud()}
function showCard(){phase="card";const c=S[st].c[solved];
  ov(`<p class="mut">Tahap ${st+1} · Kartu ${solved+1} dari 10</p><div class="card"><h2>${c[0]}</h2><p class="big">${B(c[1])}</p></div><div class="bar"><i id="fl" style="width:100%"></i></div><p class="mut"><b id="sc" style="font-size:1.3rem;color:#fff">${DUR}</b> detik</p>`);
  clearInterval(tm);t0=Date.now();tm=setInterval(()=>{const l=Math.max(0,DUR-(Date.now()-t0)/1e3);$("sc").textContent=Math.ceil(l);$("fl").style.width=l/DUR*100+"%";
    if(l<=0){clearInterval(tm);gates[solved].open();cp=gates[solved].z-1.5;solved++;ov(null);phase="play";hud();toast(solved<10?"Kartu dihafal. Lanjut berjalan!":"Semua kartu selesai. Masuk portal!")}},250)}
function toExam(){phase="intro";ov(`<h2>Kartu ditutup</h2><p>Sekarang <b>Jalur Ujian</b>. Di tiap gerbang kuning, jawab soal isian dari ingatanmu. Jawaban salah mengurangi HP ${DMG}. Setelah gerbang terbuka, lanjutkan petualangan dan ambil cincin untuk memulihkan HP. HP kembali penuh.</p><button id="ex">Mulai ujian</button>`)}
function startExam(){hp=100;solved=0;cp=4;build(st,"exam");reset(4);go()}
function openQ(){phase="q";Object.keys(K).forEach(k=>K[k]=0);down=false;
  ov(`<p class="mut">Gerbang ${solved+1} dari 10 · HP ${hp}</p><h2>${S[st].q[solved][0]}</h2><input id="an" autocomplete="off" autocapitalize="off" placeholder="Jawaban singkat"><p class="ms" id="ms"></p><button id="gb">Jawab</button>`);
  setTimeout(()=>$("an")&&$("an").focus(),50)}
async function ans(){const q=S[st].q[solved],raw=$("an").value.trim();if(!raw){$("ms").textContent="Tulis jawabanmu dulu.";return}
  const a=A[st][solved]||(A[st][solved]={v:raw,ok:false});$("gb").disabled=true;let ok=local(raw,q[1]);
  if(!ok&&SM){$("ms").style.color="#9DB8AD";$("ms").textContent="Memeriksa jawabanmu…";try{ok=await judge(q,raw)}catch(e){}$("ms").style.color=""}
  if(phase!=="q")return;
  if(ok){if(!a.t)a.ok=true;gates[solved].open();cp=gates[solved].z-1.5;solved++;ov(null);phase="play";hud();toast(solved<10?"Gerbang terbuka! Lanjutkan petualangan.":"Semua gerbang terbuka! Masuk portal.")}
  else{a.t=1;hp=Math.max(0,hp-DMG);hud();if(hp<=0)faint();else{$("gb").disabled=false;$("ms").textContent="Belum tepat. HP -"+DMG+". Ingat lagi kartunya.";$("an").select()}}}
function faint(){phase="over";ov(`<h2>HP habis</h2><p>Kamu pingsan di Tahap ${st+1}. Kamu mengulang dari Jalur Hafalan.</p><button id="rt">Ulangi tahap ini</button>`)}
function done(){phase="end";$("hud").hidden=true;R[st]=A[st].filter(a=>a&&a.ok).length;const all=Object.keys(R).length===3;
  ov(`<h2>Portal terbuka! Tahap ${st+1} selesai</h2><p>Benar pada percobaan pertama: <b>${R[st]}/10</b>. Tahap ini tidak bisa diulang.</p><button id="${all?"sm":"hm"}">${all?"Lihat penilaian akhir":"Kembali ke menu tahap"}</button>`)}
function summary(){const nl=nilai(),w=S.map((s,i)=>(A[i]||[]).map((a,j)=>a&&a.ok?"":`<li>Tahap ${i+1}, soal ${j+1}: jawabanmu “${esc(a?a.v:"kosong")}”, kunci: ${s.q[j][1].split(",")[0]}</li>`).join("")).join("");
  ov(`<h1>Penilaian akhir</h1><p class="mut">${esc(name)}, kelas ${esc(kelas)}</p><p class="big"><b style="font-size:2.2rem">${nl}</b> ${nl>=KKM?"Tuntas":"Belum tuntas"} (KKM ${KKM}). ${benar()} dari ${total()} soal benar pada percobaan pertama.</p>${S.map((s,i)=>`<p>Tahap ${i+1}: ${s.t}: <b>${R[i]}/10</b></p>`).join("")}${w?`<h2>Perlu diperbaiki</h2><ul class="mut">${w}</ul>`:"<p>Semua benar.</p>"}<button id="cp">Salin hasil</button>`)}
$("ov").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.i!=null){name=$("nm").value.trim();kelas=$("kl").value.trim();if(!name||!kelas){$("er").textContent="Isi nama dan kelas dulu.";return}begin(+b.dataset.i)}
  else if(b.id==="gb")ans();else if(b.id==="sp")go();else if(b.id==="ex")startExam();else if(b.id==="rt")begin(st);else if(b.id==="hm")home();else if(b.id==="sm")summary();
  else if(b.id==="cp"){const t="Nama: "+name+"\nKelas: "+kelas+"\n"+S.map((s,i)=>"Tahap "+(i+1)+": "+R[i]+"/10").join("\n")+"\nNilai: "+nilai()+" ("+(nilai()>=KKM?"Tuntas":"Belum tuntas")+", KKM "+KKM+")";
    try{navigator.clipboard.writeText(t).then(()=>b.textContent="Tersalin",()=>b.textContent="Gagal menyalin")}catch(x){b.textContent="Gagal menyalin"}}});
$("ov").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="an")ans()});
home();
</script></body></html>
